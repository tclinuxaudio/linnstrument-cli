name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux-static:
    name: Linux static (musl)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check linting
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Name binary
        run: |
          cp target/x86_64-unknown-linux-musl/release/linnstrument-cli \
             linnstrument-cli-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linnstrument-cli-linux-x86_64
          path: linnstrument-cli-linux-x86_64
          if-no-files-found: error

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain for Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build aarch64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Combine into a universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/linnstrument-cli \
            target/x86_64-apple-darwin/release/linnstrument-cli \
            -output linnstrument-cli-macos-universal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linnstrument-cli-macos-universal
          path: linnstrument-cli-macos-universal
          if-no-files-found: error

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Name binary
        shell: bash
        run: |
          cp target/release/linnstrument-cli.exe \
             linnstrument-cli-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linnstrument-cli-windows-x86_64
          path: linnstrument-cli-windows-x86_64.exe
          if-no-files-found: error

  check:
    name: Check (fast)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo build

  release:
    name: Publish binaries to GitHub Release
    needs: [linux-static, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: linnstrument-cli-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
